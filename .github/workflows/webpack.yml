name: Monorepo validation

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Run API unit and adapter tests
        run: npm test
      - name: Build Red network landing
        run: npm run build --workspace=@shippiyyukon/landing-red
      - name: Build management panel
        run: npm run build --workspace=@shippiyyukon/web
      - name: Build institutional landing
        run: npm run build --workspace=@shippiyyukon/landing-shippiyyukon
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
